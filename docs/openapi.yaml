openapi: 3.0.3
info:
  title: CacheLab API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /keys:
    post:
      summary: Créer une clé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  example: prix_42
                value:
                  type: string
                  example: "19.99"
      responses:
        "201":
          description: Clé créée
        "400":
          description: JSON invalide ou clé manquante
        "409":
          description: La clé existe déjà
  /keys/{key}:
    get:
      summary: Lire une clé
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          example: prix_42
      responses:
        "200":
          description: Valeur trouvée
        "404":
          description: Clé introuvable
    put:
      summary: Modifier la valeur d'une clé existante
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          example: prix_42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  example: "24.99"
      responses:
        "200":
          description: Valeur modifiée
        "400":
          description: JSON invalide
        "404":
          description: Clé introuvable